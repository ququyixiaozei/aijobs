name: ingest
on:
  schedule:
    - cron: "0 6 * * *"        # daily 06:00 UTC
  workflow_dispatch: {}         # allow manual run from the Actions tab
permissions:
  contents: write               # lets the bot commit data/jobs.json
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch latest jobs
        run: node ingest/run.mjs
      - name: Commit refreshed feed
        run: |
          git config user.name "ingest-bot"
          git config user.email "ingest@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "chore: refresh jobs feed" || echo "no changes"
          git push
