name: deploy
on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * *"      # daily 06:00 UTC: refresh jobs + redeploy
  workflow_dispatch: {}
permissions:
  contents: write            # commit refreshed jobs.json
  pages: write               # deploy to Pages
  id-token: write            # Pages OIDC
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # custom domain at root (warpjobs.com) — no basePath
      SITE_URL: https://warpjobs.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - name: Unit tests (gate — broken logic blocks deploy)
        run: npm test
      - name: Refresh jobs feed (US runner reaches all ATSs)
        run: node ingest/run.mjs
      - name: Commit refreshed feed
        continue-on-error: true
        run: |
          git config user.name "ingest-bot"
          git config user.email "ingest@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "chore: refresh jobs feed" || echo "no changes"
          git push || echo "nothing to push"
      - run: npm run build
      - run: echo "warpjobs.com" > out/CNAME    # GitHub Pages custom domain
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./out }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
